<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horde Name Generator</title>
<style>
:root{--bg:#f3f0fa;--surface:#ffffff;--ink:#1f1b3a;--muted:#6b6690;--accent:#4b3fd1;--accent-ink:#ffffff;--line:#d9d4ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15122b;--surface:#1f1b3d;--ink:#f0edff;--muted:#a49fcb;--accent:#a99dff;--accent-ink:#15122b;--line:#352f66}}
:root[data-theme="dark"]{--bg:#15122b;--surface:#1f1b3d;--ink:#f0edff;--muted:#a49fcb;--accent:#a99dff;--accent-ink:#15122b;--line:#352f66}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Iowan Old Style",serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:28px 18px 40px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.01em}
p.sub{margin:0 0 20px;color:var(--muted);font-family:system-ui,sans-serif;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;font-family:system-ui,sans-serif}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:999px;font-size:.9rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.go{width:100%;border:0;background:var(--accent);color:var(--accent-ink);font:600 1.05rem system-ui,sans-serif;padding:15px;border-radius:12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
ul{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px}
li button{width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:1.35rem Georgia,serif;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
li small{font:.75rem system-ui,sans-serif;color:var(--muted)}
.note{margin-top:16px;text-align:center;color:var(--muted);font:.85rem system-ui,sans-serif;min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>Horde name generator</h1>
<p class="sub">Pick a race, tap Generate, tap a name to copy it. Clan names only, like Goldtusk or Skywhisper.</p>
<div class="chips" id="chips" role="group" aria-label="Name style"></div>
<button class="go" id="go">Generate names</button>
<ul id="out"></ul>
<div class="note" id="note"></div>
</main>
<script>
var R=function(a){return a[Math.floor(Math.random()*a.length)]};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var mk=function(p,sf){return function(){return cap(R(p)+R(sf))}};
var G={
Orc:mk(["gro","thok","dur","mak","gar","zug","kor","grom","throg","ug","nar","drak","bol"],["nash","gar","tak","mok","gul","dar","zul","rok","gor","mash"]),
Troll:mk(["vol","zul","zan","jin","rok","mal","tor","sen","kal","hak"],["jin","tazi","kar","zala","mah","dari","gesh","lo","tala","mon"]),
Tauren:mk(["tak","ahn","hamu","kor","nara","mah","ruk","tala","bael","cairn"],["ra","wa","ak","ha","ta","nu","moon","horn"]),
Forsaken:mk(["mort","sil","ed","lil","cass","thad","wen","iso","cor","vesp","nox","hel"],["imer","as","ric","ian","ia","deus","del","lde","win","era","ius","ra"]),
"Skyborn Elf":mk(["aer","kael","lor","sky","val","thal","syl","anar","ren","eil"],["ion","anar","wen","rith","dis","thas","ael","yra","dil","isa"]),

};
var F={Orc:["Bloodfang","Ironmaw","Stonefist","Skullsplit","Redblade","Blackrock","Warbringer","Ashtusk"],Troll:["Goldtusk","Bonecaller","Shadowtusk","Sunscale","Jungleblood","Spiritfang","Mistwalker","Voodoohand"],Tauren:["Stonehoof","Skychaser","Thunderhorn","Windtotem","Dawnstrider","Earthsong","Highplains","Redmane"],Forsaken:["Graveswell","Ashmoor","Blackwood","Crowmere","Deadwick","Thornbury","Wormley","Grimhollow"],"Skyborn Elf":["Skywhisper","Dawnblade","Goldenleaf","Cloudsinger","Brightspear","Silverwing","Starweaver","Windshear"],Goblin:["Sparkwrench","Gearwhistle","Boltfuse","Cogsprocket","Blastnozzle","Greasepot","Rocketfizz","Copperpot"]};
var seen={};
var A={Orc:["Blood","Iron","Stone","Skull","Red","Black","War","Ash","Doom","Grim"],Troll:["Gold","Bone","Sand","Sun","Spirit","Earth","Ghost","Mist","Voodoo","Blood","Night","Storm","Hex","Flame"],Tauren:["Stone","Sky","Thunder","Wind","Dawn","Earth","High","Red","Blood","Spirit","Plains","Cloud","Moon"],Forsaken:["Grave","Ash","Black","Crow","Dead","Thorn","Worm","Grim","Night","Bone"],"Skyborn Elf":["Sky","Dawn","Golden","Cloud","Bright","Silver","Star","Wind","Sun","Moon"]};
var B={Orc:["fang","maw","fist","breaker","crusher","render","cleaver","bane","scar","blade","rock","bringer","tusk","hammer","claw","axe"],Troll:["tusk","caller","scale","blood","fang","walker","hand","spear","fury","shatter","weaver"],Tauren:["hoof","chaser","horn","totem","strider","song","mane","walker","runner","keeper","hide"],Forsaken:["well","moor","wood","mere","wick","bury","hollow","bane","ley"],"Skyborn Elf":["whisper","blade","leaf","singer","spear","wing","weaver","shear","dancer","call"]};
var cur="Orc",chips=document.getElementById("chips"),out=document.getElementById("out"),note=document.getElementById("note");
Object.keys(G).forEach(function(k){var b=document.createElement("button");b.className="chip";b.textContent=k;b.setAttribute("aria-pressed",k===cur);b.onclick=function(){cur=k;[].forEach.call(chips.children,function(c){c.setAttribute("aria-pressed",c.textContent===k)});gen()};chips.appendChild(b)});
function gen(){seen={};out.innerHTML="";note.textContent="";for(var i=0;i<8;i++){var n;do{n=R(A[cur])+R(B[cur])}while(n.length>12||seen[n]);seen[n]=1;var li=document.createElement("li");var b=document.createElement("button");b.innerHTML="<span></span><small>Copy</small>";b.firstChild.textContent=n;(function(n){b.onclick=function(){var done=function(){note.textContent="Copied: "+n};try{navigator.clipboard.writeText(n).then(done,function(){note.textContent="Copy isn’t available here"})}catch(e){note.textContent="Copy isn’t available here"}}})(n);li.appendChild(b);out.appendChild(li)}}
document.getElementById("go").onclick=gen;gen();
</script>
</body>
</html>
